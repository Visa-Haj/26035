<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>پنل مدیر کاروان</title>

<style>
body {
  font-family: Tahoma;
  direction: rtl;
  background: #eef3ef;
  text-align: center;
  padding: 30px;
}

.box {
  background: white;
  max-width: 400px;
  margin: auto;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

input {
  width: 90%;
  padding: 10px;
  margin: 8px;
  text-align: center;
}

button {
  padding: 10px;
  width: 90%;
  background: #0b5d3b;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="box">

<h3>پنل مدیر کاروان</h3>

<input id="adminPass" placeholder="رمز مدیر">
<button onclick="login()">ورود</button>

<div id="panel" style="display:none">

  <input id="nat" placeholder="کد ملی">
  <input id="zay" placeholder="کد زائر">

  <input type="file" id="passport">
  <input type="file" id="visa">

  <button onclick="addUser()">ثبت زائر</button>

  <pre id="output"></pre>

</div>

</div>

<script>

let data = {};

function login() {
  const pass = document.getElementById("adminPass").value;

  if (pass !== "1234") {
    alert("رمز اشتباه است");
    return;
  }

  document.getElementById("panel").style.display = "block";
}

function addUser() {
  const nat = document.getElementById("nat").value;
  const zay = document.getElementById("zay").value;

  const passportFile = document.getElementById("passport").files[0];
  const visaFile = document.getElementById("visa").files[0];

  if (!nat || !zay) {
    alert("اطلاعات ناقص است");
    return;
  }

  const passportPath = "files/" + passportFile.name;
  const visaPath = "files/" + visaFile.name;

  data[nat] = {
    zayear: zay,
    passport: passportPath,
    visa: visaPath
  };

  document.getElementById("output").innerText =
    JSON.stringify(data, null, 2);

  alert("ثبت شد ✔ حالا data.json را جایگزین کن");
}

</script>

</body>
</html>
