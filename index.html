<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهده ویزا | کاروان 26035</title>

<style>
body {
  direction: rtl;
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: linear-gradient(180deg, #f4f7f3, #e2eee6);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 0 12px 24px;
}

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #0b5d3b, #3aa66b);
}

.container {
  width: 100%;
  max-width: 420px;
  background: #fff;
  margin-top: 20px;
  padding: 28px 20px 32px;
  border-radius: 20px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.12);
  text-align: center;
}

.logo img {
  width: 180px;
  margin-bottom: 15px;
}

.title {
  font-size: 20px;
  font-weight: bold;
  color: #0b5d3b;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 13px;
  color: #555;
  margin-bottom: 20px;
  line-height: 1.7;
}

input {
  width: 90%;
  font-size: 16px;
  padding: 12px;
  text-align: center;
  border-radius: 12px;
  border: 1px solid #ccc;
  margin-bottom: 12px;
}

button {
  width: 90%;
  font-size: 17px;
  padding: 13px;
  border-radius: 12px;
  border: none;
  background: #0b5d3b;
  color: #fff;
  cursor: pointer;
}

button:hover {
  background: #094d31;
}

.download-btn {
  display: none;
  width: 90%;
  margin-top: 15px;
  padding: 13px;
  background: #1b7f4d;
  color: #fff;
  border-radius: 12px;
  text-decoration: none;
}

.error {
  margin-top: 15px;
  color: red;
  display: none;
}

img {
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="top-bar"></div>

<div class="container">

  <div class="logo">
    <img src="logo.png">
  </div>

  <div class="title">مشاهده ویزای زائر</div>

  <div class="subtitle">
    کاروان 26035<br>
    لطفاً کد ملی و کد زائر را وارد کنید
  </div>

  <input id="natCode" placeholder="کد ملی">
  <input id="zayearCode" placeholder="کد زائر">

  <button onclick="checkUser()">مشاهده ویزا</button>

  <div id="error" class="error"></div>

  <a id="downloadBtn" class="download-btn" target="_blank">
    📥 دانلود ویزا
  </a>

  <img id="passportImg" style="display:none;">

</div>

<script>
let data = {};

fetch('data.json')
  .then(res => res.json())
  .then(json => data = json);

function checkUser() {
  const nat = document.getElementById("natCode").value.trim();
  const zay = document.getElementById("zayearCode").value.trim();

  const error = document.getElementById("error");
  const btn = document.getElementById("downloadBtn");
  const img = document.getElementById("passportImg");

  const user = data[nat];

  if (!user || user.zayear !== zay) {
    error.innerText = "❌ کد ملی یا کد زائر اشتباه است یا هم‌خوانی ندارد";
    error.style.display = "block";
    btn.style.display = "none";
    img.style.display = "none";
    return;
  }

  error.style.display = "none";

  // نمایش ویزا
  btn.href = user.visa;
  btn.style.display = "block";

  // نمایش عکس پاسپورت
  img.src = user.passport;
  img.style.display = "block";

  // باز کردن PDF
  window.open(user.visa, "_blank");
}
</script>

</body>
</html>
